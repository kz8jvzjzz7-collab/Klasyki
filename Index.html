<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Класики — міні-гра</title>
<style>
  :root{--chalk:#f7f1c7;--active:#ffd95a;--bg1:#496f4e;--bg2:#355c3c;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.05),transparent 18%),
    radial-gradient(circle at 80% 70%,rgba(0,0,0,.08),transparent 22%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
    color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .app{width:min(94vw,820px);height:min(94vh,980px);display:flex;flex-direction:column;gap:12px;padding:14px}
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .stat{font-weight:800;font-size:clamp(18px,3vw,30px);text-shadow:0 2px 3px #0006}
  .stat.right{text-align:right}
  .title{text-align:center;font-size:clamp(20px,3.5vw,34px);font-weight:900;letter-spacing:.04em}
  .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  .board{width:min(72vw,520px);aspect-ratio:0.58;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(7,1fr);gap:8px;transform:perspective(700px) rotateX(4deg)}
  .cell{position:relative;border:4px solid var(--chalk);border-radius:8px;color:var(--chalk);font-size:clamp(36px,7vw,72px);font-family:"Comic Sans MS","Segoe Print",cursive;font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;cursor:pointer;box-shadow:0 0 0 1px #ffffff14 inset;transition:transform .08s, background .08s, box-shadow .08s}
  .single{grid-column:1 / span 2;justify-self:center;width:49%}
  .c1{grid-row:7}.c2{grid-row:6;grid-column:1}.c3{grid-row:6;grid-column:2}.c4{grid-row:5}.c5{grid-row:4;grid-column:1}.c6{grid-row:4;grid-column:2}.c7{grid-row:3}.c8{grid-row:2;grid-column:1}.c9{grid-row:2;grid-column:2}.c10{grid-row:1}
  .cell.active{background:var(--active);color:#384a32;box-shadow:0 0 26px #ffd95acc, inset 0 0 0 2px #fff8;transform:scale(1.03)}
  .cell.hit{transform:scale(.92)}
  .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  button{border:0;border-radius:16px;padding:14px 24px;font-size:20px;font-weight:900;cursor:pointer;background:#f4e9b8;color:#2f5035;box-shadow:0 5px 0 #bbaa6d}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #bbaa6d}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#17301fd9;border-radius:22px;backdrop-filter:blur(3px);z-index:3;text-align:center;padding:20px}
  .overlay.hidden{display:none}
  .card{max-width:520px}
  .big{font-size:clamp(44px,10vw,96px);font-weight:1000;margin:0 0 8px}
  .sub{font-size:clamp(18px,3vw,28px);opacity:.9;margin-bottom:20px}
  .hint{text-align:center;opacity:.8;font-size:14px}
  @media (max-height:720px){.app{height:100vh}.board{width:min(56vw,430px)}.controls button{padding:10px 18px;font-size:18px}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="stat">⏱ <span id="time">30.0</span></div>
    <div class="title">КЛАСИКИ</div>
    <div class="stat right">⭐ <span id="score">0</span></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cell single c10" data-n="10">10</div>
      <div class="cell c8" data-n="8">8</div><div class="cell c9" data-n="9">9</div>
      <div class="cell single c7" data-n="7">7</div>
      <div class="cell c5" data-n="5">5</div><div class="cell c6" data-n="6">6</div>
      <div class="cell single c4" data-n="4">4</div>
      <div class="cell c2" data-n="2">2</div><div class="cell c3" data-n="3">3</div>
      <div class="cell single c1" data-n="1">1</div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <div class="big" id="overlayTitle">Класики</div>
        <div class="sub" id="overlayText">Натискай на підсвічену клітинку якомога швидше. Маєш 30 секунд.</div>
        <button id="startBtn">СТАРТ</button>
      </div>
    </div>
  </div>

  <div class="controls"><button id="restartBtn">↻ Заново</button></div>
  <div class="hint">Працює мишкою й пальцем. Промах = −1 бал.</div>
</div>
<script>
const cells=[...document.querySelectorAll('.cell')];
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const overlay=document.getElementById('overlay');
const overlayTitle=document.getElementById('overlayTitle');
const overlayText=document.getElementById('overlayText');
const startBtn=document.getElementById('startBtn');
const restartBtn=document.getElementById('restartBtn');
let active=null, score=0, running=false, startTime=0, raf=0, lastIndex=-1;
const DURATION=30000;

function beep(freq=700,dur=.05,type='sine'){
  try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.08,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);}catch(e){}
}
function nextCell(){
  if(active) active.classList.remove('active');
  let i; do{i=Math.floor(Math.random()*cells.length)}while(i===lastIndex);
  lastIndex=i; active=cells[i]; active.classList.add('active');
}
function update(){
  if(!running)return;
  const left=Math.max(0,DURATION-(performance.now()-startTime));
  timeEl.textContent=(left/1000).toFixed(1);
  if(left<=0){endGame();return}
  raf=requestAnimationFrame(update);
}
function startGame(){
  score=0; scoreEl.textContent=score; timeEl.textContent='30.0'; running=true; overlay.classList.add('hidden'); startTime=performance.now(); nextCell(); beep(880,.08); update();
}
function endGame(){
  running=false; cancelAnimationFrame(raf); if(active)active.classList.remove('active');
  beep(330,.16,'square'); setTimeout(()=>beep(220,.25,'square'),120);
  overlayTitle.textContent=`Результат: ${score}`;
  overlayText.textContent= score>=35?'🔥 Реакція відмінника!':score>=25?'👏 Дуже швидко!':score>=15?'Непогано! Ще одна спроба?':'Треба розім’яти пальці 😄';
  startBtn.textContent='ЩЕ РАЗ'; overlay.classList.remove('hidden');
}
function handleCell(e){
  if(!running)return;
  const c=e.currentTarget;
  if(c===active){score++; scoreEl.textContent=score; c.classList.add('hit'); setTimeout(()=>c.classList.remove('hit'),80); beep(880,.035); nextCell();}
  else{score=Math.max(0,score-1);scoreEl.textContent=score;beep(180,.06,'square');}
}
cells.forEach(c=>c.addEventListener('pointerdown',handleCell));
startBtn.addEventListener('click',startGame);restartBtn.addEventListener('click',startGame);
</script>
</body>
</html>
