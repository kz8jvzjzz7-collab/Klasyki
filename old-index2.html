<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Класики — шкільна мінігра</title>
<style>
:root{--bg:#264d38;--chalk:#f7f1c7;--yellow:#ffd95a;--shadow:rgba(0,0,0,.28)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:white}
body{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.035),transparent 25%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.03),transparent 30%),linear-gradient(135deg,#315c43,#1f4330);touch-action:manipulation}
button,input{font:inherit}.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}
#startScreen,#gameOverScreen{align-items:center;justify-content:center;padding:24px;text-align:center}
.card{width:min(92vw,680px);padding:28px;border:3px solid rgba(247,241,199,.8);border-radius:28px;background:rgba(0,0,0,.2);box-shadow:0 18px 50px var(--shadow)}
h1{font-size:clamp(42px,9vw,76px);margin:0 0 8px;font-weight:900;letter-spacing:-2px}.subtitle{font-size:clamp(18px,4.5vw,26px);opacity:.88;margin-bottom:24px}
.character-row{display:flex;gap:16px;justify-content:center;margin:18px 0 22px}.character{width:130px;height:130px;border:3px solid rgba(255,255,255,.28);border-radius:24px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.character .emoji{font-size:64px;line-height:1}.character span:last-child{margin-top:6px;font-weight:800}.character.selected{transform:scale(1.05);background:rgba(255,217,90,.18);border-color:var(--yellow)}
.primary{border:0;border-radius:18px;padding:16px 28px;font-weight:900;font-size:22px;background:var(--yellow);color:#2e3728;box-shadow:0 8px 0 #c3a43c;cursor:pointer}.primary:active{transform:translateY(5px);box-shadow:0 3px 0 #c3a43c}.hint{font-size:14px;opacity:.72;margin-top:16px}
#gameScreen{flex-direction:column}.hud{position:relative;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;background:rgba(0,0,0,.2);min-height:74px;border-bottom:2px solid rgba(247,241,199,.24)}
.hud-left,.hud-right{display:flex;align-items:center;gap:12px}.hud-right{justify-content:flex-end}.level{font-weight:900;font-size:clamp(18px,4.5vw,28px)}.score{font-size:clamp(18px,4vw,26px);font-weight:800}.target-pill{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-weight:800}.lives{font-size:clamp(20px,5vw,32px);letter-spacing:2px;white-space:nowrap}.timer-wrap{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.09)}.timer{height:100%;width:100%;background:var(--yellow);transform-origin:left center}
.game-area{position:relative;flex:1;min-height:0;overflow:hidden;padding:10px}.board{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(82vw,560px);height:calc(100% - 28px);display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:5px;z-index:10}
.cell{position:relative;border:3px solid rgba(247,241,199,.95);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--chalk);font-size:clamp(24px,7vw,46px);font-weight:900;background:rgba(255,255,255,.025);cursor:pointer;user-select:none}.cell.single{grid-column:1 / 3;width:50%;justify-self:center}.cell.expected{background:rgba(255,217,90,.16);box-shadow:inset 0 0 0 4px rgba(255,217,90,.25)}.cell.wrong{animation:wrong .18s 2}@keyframes wrong{50%{background:rgba(255,80,80,.42)}}
.runner{position:absolute;z-index:18;font-size:clamp(30px,8vw,54px);pointer-events:none;transition:left .16s ease,top .16s ease,transform .16s ease;transform:translate(-50%,-55%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
.flyer{position:absolute;z-index:16;font-size:clamp(28px,7vw,46px);pointer-events:none;will-change:transform,left,top}.flyer.good{filter:drop-shadow(0 0 8px rgba(110,255,110,.7))}.flyer.bad{filter:drop-shadow(0 0 8px rgba(255,90,90,.6))}
.flash{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0}.flash.good{background:rgba(80,255,120,.18)}.flash.bad{background:rgba(255,60,60,.2)}.flash.show{animation:flash .35s}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.level-banner{position:absolute;z-index:50;left:50%;top:48%;transform:translate(-50%,-50%) scale(.85);padding:18px 28px;border-radius:20px;background:rgba(0,0,0,.68);border:3px solid var(--chalk);font-size:clamp(28px,7vw,54px);font-weight:1000;opacity:0;pointer-events:none}.level-banner.show{animation:banner 1.05s ease}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
#nameInput{width:min(100%,420px);padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-size:20px;outline:none;margin:10px 0 16px;text-align:center}#nameInput::placeholder{color:rgba(255,255,255,.55)}.result{font-size:clamp(26px,6vw,44px);font-weight:900;margin:12px 0}.small{opacity:.75;font-size:15px}
@media (min-width:800px){.game-area{padding:18px}.board{width:min(48vw,560px)}}
</style>
</head>
<body>
<section id="startScreen" class="screen active"><div class="card"><h1>КЛАСИКИ</h1><div class="subtitle">Натискай клітинки по черзі та дійди до 100 рівня</div><div>Обери персонажа:</div><div class="character-row"><button class="character selected" data-char="👧🎒"><span class="emoji">👧</span><span>Дівчинка 🎒</span></button><button class="character" data-char="👦🎒"><span class="emoji">👦</span><span>Хлопчик 🎒</span></button></div><button id="startBtn" class="primary">🔔 ПОЧАТИ</button><div class="hint">5 життів • +1 бал за кожну правильну клітинку • з 7 рівня з'являються предмети</div></div></section>
<section id="gameScreen" class="screen"><div class="hud"><div class="hud-left"><div class="level" id="levelText">Рівень 1/100</div><div class="target-pill">Тисни: <span id="targetText">1</span></div></div><div class="lives" id="livesText">❤️❤️❤️❤️❤️</div><div class="hud-right"><div class="score">Бали: <span id="scoreText">0</span></div></div><div class="timer-wrap"><div class="timer" id="timerBar"></div></div></div><div class="game-area" id="gameArea"><div class="board" id="board"></div><div class="runner" id="runner">👧🎒</div><div class="flash good" id="goodFlash"></div><div class="flash bad" id="badFlash"></div><div class="level-banner" id="levelBanner">Рівень 1/100</div></div></section>
<section id="gameOverScreen" class="screen"><div class="card"><h1 id="gameOverTitle">ГРУ ЗАВЕРШЕНО</h1><div class="result">Твій результат: <span id="finalScore">0</span> балів</div><input id="nameInput" maxlength="24" placeholder="Введи ім'я"><div id="namedResult" class="subtitle" style="margin:4px 0 18px"></div><button id="saveNameBtn" class="primary">ЗБЕРЕГТИ РЕЗУЛЬТАТ</button><div style="height:12px"></div><button id="restartBtn" class="primary">ЗІГРАТИ ЩЕ РАЗ</button><div class="small" style="margin-top:16px">Результат зберігається на цьому пристрої.</div></div></section>
<script>
(() => {
const $=s=>document.querySelector(s), startScreen=$('#startScreen'), gameScreen=$('#gameScreen'), gameOverScreen=$('#gameOverScreen'), board=$('#board'), runner=$('#runner'), gameArea=$('#gameArea'), levelText=$('#levelText'), targetText=$('#targetText'), scoreText=$('#scoreText'), livesText=$('#livesText'), timerBar=$('#timerBar'), levelBanner=$('#levelBanner'), goodFlash=$('#goodFlash'), badFlash=$('#badFlash');
let selectedChar='👧🎒', level=1, score=0, lives=5, expected=1, maxCell=10, running=false, deadline=0, raf=0, flyers=[], flyerTimer=0, lastFrame=0, invulnerableUntil=0;
document.querySelectorAll('.character').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.character').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selectedChar=btn.dataset.char}));
$('#startBtn').addEventListener('click',startGame);$('#restartBtn').addEventListener('click',()=>{gameOverScreen.classList.remove('active');startScreen.classList.add('active')});$('#saveNameBtn').addEventListener('click',saveName);
function showScreen(screen){[startScreen,gameScreen,gameOverScreen].forEach(s=>s.classList.remove('active'));screen.classList.add('active')}
function boardSizeForLevel(lvl){if(lvl>=15)return 20;if(lvl>=5)return 15;return 10}
function stepTimeMs(){return Math.max(520,1800*Math.pow(0.978,level-1))}
function objectSpeedPxPerSec(){return 34*Math.pow(1.0055,level-7)}
function startGame(){level=1;score=0;lives=5;expected=1;running=true;flyers=[];maxCell=boardSizeForLevel(level);runner.textContent=selectedChar;showScreen(gameScreen);playSchoolBell();buildBoard();updateHUD();setDeadline();showLevelBanner();lastFrame=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function buildBoard(){board.innerHTML='';const pairMap=new Set();if(maxCell===10)[2,3,5,6,8,9].forEach(n=>pairMap.add(n));else if(maxCell===15)[2,3,5,6,8,9,11,12,14,15].forEach(n=>pairMap.add(n));else [2,3,5,6,8,9,11,12,14,15,17,18,19,20].forEach(n=>pairMap.add(n));let n=1;while(n<=maxCell){if(pairMap.has(n)&&pairMap.has(n+1)){board.append(makeCell(n,false),makeCell(n+1,false));n+=2}else{board.append(makeCell(n,true));n++}}markExpected();requestAnimationFrame(()=>moveRunnerToCell(1,false))}
function makeCell(n,single){const el=document.createElement('button');el.className='cell'+(single?' single':'');el.dataset.n=n;el.textContent=n;el.addEventListener('click',()=>tapCell(n,el));return el}
function tapCell(n,el){if(!running)return;if(n!==expected){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),380);return}score++;moveRunnerToCell(n,true);expected++;if(expected>maxCell)completeLevel();else{setDeadline();markExpected();updateHUD()}}
function completeLevel(){if(level>=100){endGame(true);return}level++;expected=1;const newSize=boardSizeForLevel(level);if(newSize!==maxCell){maxCell=newSize;buildBoard()}else{markExpected();moveRunnerToCell(1,false)}updateHUD();showLevelBanner();setDeadline()}
function setDeadline(){deadline=performance.now()+stepTimeMs()}
function markExpected(){document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('expected',Number(c.dataset.n)===expected))}
function moveRunnerToCell(n,pop){const c=board.querySelector(`[data-n="${n}"]`);if(!c)return;const ar=gameArea.getBoundingClientRect(),cr=c.getBoundingClientRect();runner.style.left=(cr.left-ar.left+cr.width/2)+'px';runner.style.top=(cr.top-ar.top+cr.height/2)+'px';if(pop){runner.style.transform='translate(-50%,-55%) scale(1.18)';setTimeout(()=>runner.style.transform='translate(-50%,-55%) scale(1)',120)}}
function updateHUD(){levelText.textContent=`Рівень ${level}/100`;targetText.textContent=expected;scoreText.textContent=score;livesText.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,5-lives))}
function showLevelBanner(){levelBanner.textContent=`Рівень ${level}/100`;levelBanner.classList.remove('show');void levelBanner.offsetWidth;levelBanner.classList.add('show')}
function loseLife(){if(performance.now()<invulnerableUntil||!running)return;lives--;invulnerableUntil=performance.now()+550;flash(badFlash);if(navigator.vibrate)navigator.vibrate(70);updateHUD();if(lives<=0)endGame(false)}
function gainLife(){if(!running)return;lives=Math.min(5,lives+1);flash(goodFlash);if(navigator.vibrate)navigator.vibrate(35);updateHUD()}
function flash(el){el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-lastFrame)/1000);lastFrame=t;const remain=Math.max(0,(deadline-t)/stepTimeMs());timerBar.style.transform=`scaleX(${remain})`;if(t>=deadline){loseLife();if(!running)return;expected=1;markExpected();updateHUD();setDeadline();moveRunnerToCell(1,false)}if(level>=7){const interval=Math.max(950,3200-(level-7)*18);if(t-flyerTimer>interval){spawnFlyer();flyerTimer=t}updateFlyers(dt);checkCollisions()}raf=requestAnimationFrame(loop)}
const itemDefs=[{icon:'🌭',good:true,dir:'h'},{icon:'🪢',good:true,dir:'v'},{icon:'🔔',good:false,dir:'h'},{icon:'🍮',good:false,dir:'v'},{icon:'📚',good:false,dir:'d'},{icon:'📏',good:false,dir:'d2'}];
function spawnFlyer(){const def=itemDefs[Math.floor(Math.random()*itemDefs.length)],el=document.createElement('div');el.className='flyer '+(def.good?'good':'bad');el.textContent=def.icon;gameArea.appendChild(el);const W=gameArea.clientWidth,H=gameArea.clientHeight,s=objectSpeedPxPerSec();let x,y,vx=0,vy=0;if(def.dir==='h'){x=-60;y=70+Math.random()*(H-140);vx=s}else if(def.dir==='v'){x=40+Math.random()*(W-80);y=-60;vy=s}else if(def.dir==='d'){x=-60;y=30+Math.random()*H*.35;vx=s*.78;vy=s*.78}else{x=W+60;y=30+Math.random()*H*.35;vx=-s*.78;vy=s*.78}flyers.push({el,def,x,y,vx,vy,hit:false})}
function updateFlyers(dt){const W=gameArea.clientWidth,H=gameArea.clientHeight;flyers.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.el.style.transform=`translate(${f.x}px,${f.y}px) rotate(${(f.x+f.y)*.08}deg)`});flyers=flyers.filter(f=>{const alive=f.x>-120&&f.x<W+120&&f.y>-120&&f.y<H+120&&!f.hit;if(!alive)f.el.remove();return alive})}
function checkCollisions(){const rr=runner.getBoundingClientRect(),r={left:rr.left+rr.width*.18,right:rr.right-rr.width*.18,top:rr.top+rr.height*.18,bottom:rr.bottom-rr.height*.12};flyers.forEach(f=>{if(f.hit)return;const fr=f.el.getBoundingClientRect(),hit=!(fr.right<r.left||fr.left>r.right||fr.bottom<r.top||fr.top>r.bottom);if(hit){f.hit=true;if(f.def.good)gainLife();else loseLife()}})}
function endGame(won){running=false;cancelAnimationFrame(raf);flyers.forEach(f=>f.el.remove());flyers=[];$('#finalScore').textContent=score;$('#gameOverTitle').textContent=won?'🎓 ТИ ПРОЙШОВ 100 РІВНІВ!':'🔔 УРОК ЗАКІНЧЕНО';$('#nameInput').value='';$('#namedResult').textContent='';showScreen(gameOverScreen)}
function saveName(){const name=$('#nameInput').value.trim()||'Гравець',row={name,score,level,date:new Date().toISOString()},arr=JSON.parse(localStorage.getItem('klasykyScores')||'[]');arr.push(row);arr.sort((a,b)=>b.score-a.score);arr.splice(10);localStorage.setItem('klasykyScores',JSON.stringify(arr));$('#namedResult').textContent=`${name}: ${score} балів • рівень ${Math.min(level,100)}`}
function playSchoolBell(){try{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),now=ctx.currentTime;[0,.14,.31].forEach((off,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(i===1?880:1046,now+off);gain.gain.setValueAtTime(.0001,now+off);gain.gain.exponentialRampToValueAtTime(.22,now+off+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+off+.55);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+off);osc.stop(now+off+.58)})}catch(e){}}
})();
</script>
</body>
</html>
